<script>
// Red de seguridad visible. Se inyecta ANTES del script del juego.
//
// Por qué existe: cuando el juego moría al arrancar, el usuario solo veía un
// canvas negro. Cero información. Esto convierte "no anda" en un reporte útil.
(function () {
  var problemas = [];

  function mostrar() {
    if (document.getElementById('aviso-error')) return;
    var d = document.createElement('div');
    d.id = 'aviso-error';
    d.style.cssText = 'position:fixed;inset:0;background:#111;color:#eee;' +
      'font:14px/1.6 monospace;padding:28px;overflow:auto;z-index:9999;' +
      'display:flex;flex-direction:column;justify-content:center';
    d.innerHTML =
      '<div style="max-width:640px;margin:0 auto">' +
      '<h2 style="color:#ff6b6b;margin:0 0 16px">El juego no arranco</h2>' +
      '<p style="margin:0 0 16px">Copia este texto y mandalo:</p>' +
      '<pre style="background:#000;padding:16px;border-radius:6px;overflow:auto;' +
      'color:#8f8;font-size:12px;white-space:pre-wrap"></pre>' +
      '<p style="margin:16px 0 0;color:#aaa">Si en el texto dice ' +
      '&quot;Cannot read properties of null&quot;, es una version vieja del ' +
      'archivo: baja de nuevo el ZIP y descomprimilo.</p>' +
      '</div>';
    d.querySelector('pre').textContent = problemas.join('\n\n');
    document.body.appendChild(d);
  }

  window.addEventListener('error', function (e) {
    problemas.push(
      (e.message || 'error') + '\n  en ' + (e.filename || '?') + ':' + e.lineno
    );
    setTimeout(mostrar, 100);
  });

  // Por si el error ocurre antes de que se pueda registrar el listener.
  window.addEventListener('DOMContentLoaded', function () {
    setTimeout(function () { if (problemas.length) mostrar(); }, 500);
  });
})();
</script>
