n."],pinzardo:["Un cangrejo que corta el pelo mejor","que cualquier barbero humano. Sus","pinzas son tijeras de precisión."],pinzamestre:["El estilista más caro del océano.","Sus cortes cuestan una fortuna","pero valen cada moneda."],pingueson:["Un pingüino mesero que nunca derrama","una gota. Su bandeja está siempre","perfectamente equilibrada."],pinguchef:["Un pingüino que ascendió a chef.","Sus platos son fríos pero deliciosos.","Especialidad: sushi helado."],pingumitre:["Dueño del restaurante más exclusivo","del reino. La lista de espera","es de tres meses mínimo."],peztronauta:["Un pez pequeño en una burbuja-casco","espacial. Explora el mundo como si","fuera el espacio exterior. Valiente."],cosmocardumen:["Miles de peces pequeños que forman","un pez gigante con casco espacial.","Juntos son imparables. Solos, no tanto."],ivygoat:["Una cabra mayordomo que sirve té de","hierbas con elegancia impecable. Su","bandeja nunca se tambalea."],hedroble:["Una cabra butler con monóculo que","supervisa todo el servicio. Nadie","se atreve a desordenar su cocina."],gorilan:["Un gorila que escribe sonetos de amor","bajo la luna. Sus poemas hacen","llorar hasta a las piedras."],gorilirico:["Un gorila bardo que recita épicas","con voz atronadora. Los árboles","tiemblan cuando declama."],gorilegend:["La leyenda literaria del bosque.","Sus obras se estudian en todas","las escuelas del reino."],orquidea:["Una mantis religiosa que baila ballet","entre las flores. Sus movimientos","son letales y elegantes a la vez."],mantisdanza:["Una mantis con tutú de pétalos que","ejecuta piruetas perfectas. Cada","danza es una obra de arte mortal."],thornbuck:["Un carnero punk que no sigue reglas.","Sus espinas son de verdad y su actitud","también. No le pises las flores."],espinarcor:["Un carnero con chaqueta de espinas","que lidera su propia banda. Sus","conciertos destruyen escenarios."],espinardoom:["El carnero heavy metal definitivo.","Sus cuernos vibran con cada acorde.","Las paredes tiembla
